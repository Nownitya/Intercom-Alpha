<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 810" role="img" aria-labelledby="title description" font-family="system-ui, sans-serif"><title id="title">Safety and outdoor tools</title><desc id="description">Keep each field task attached to the state it needs and the feedback it owes the user.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#577168"/></marker></defs>
