<rect x="40" y="144" width="336" height="160" rx="13" fill="#DCEDE7" stroke="none"/>
<text x="56" y="169" fill="#286754" font-size="12" font-weight="700">Present in source</text>
<text x="56" y="197" fill="#162824" font-size="19" font-weight="700">Guarded SOS</text>
<text x="56" y="223" fill="#435951" font-size="15" font-weight="400">Cockpit action opens confirmation.</text>
<text x="56" y="240" fill="#435951" font-size="15" font-weight="400">Exercise cancel, confirm, send outcome and</text>
<text x="56" y="257" fill="#435951" font-size="15" font-weight="400">restoration after dismissal.</text>
<rect x="412" y="144" width="336" height="160" rx="13" fill="#DCEDE7" stroke="none"/>
<text x="428" y="169" fill="#286754" font-size="12" font-weight="700">Present in source</text>
<text x="428" y="197" fill="#162824" font-size="19" font-weight="700">Crash detection</text>
<text x="428" y="223" fill="#435951" font-size="15" font-weight="400">Sensor trigger can start a countdown;</text>
<text x="428" y="240" fill="#435951" font-size="15" font-weight="400">SwiftUI shows cancel and send-now paths</text>
<text x="428" y="257" fill="#435951" font-size="15" font-weight="400">when the signal is raised.</text>
<rect x="784" y="144" width="336" height="160" rx="13" fill="#FFF0D0" stroke="none"/>
<text x="800" y="169" fill="#8A580A" font-size="12" font-weight="700">Runtime check needed</text>
<text x="800" y="197" fill="#162824" font-size="19" font-weight="700">Emergency verification</text>
<text x="800" y="223" fill="#435951" font-size="15" font-weight="400">Check denied permissions, low</text>
<text x="800" y="240" fill="#435951" font-size="15" font-weight="400">connectivity, interruption and accessible</text>
<text x="800" y="257" fill="#435951" font-size="15" font-weight="400">cancellation on a real device.</text>
<rect x="784" y="330" width="336" height="160" rx="13" fill="#DCEDE7" stroke="none"/>
<text x="800" y="355" fill="#286754" font-size="12" font-weight="700">Present in source</text>
<text x="800" y="383" fill="#162824" font-size="19" font-weight="700">Convoy and Radar</text>
<text x="800" y="409" fill="#435951" font-size="15" font-weight="400">Relative position and roster depend on</text>
<text x="800" y="426" fill="#435951" font-size="15" font-weight="400">peer location data and freshness; show</text>
<text x="800" y="443" fill="#435951" font-size="15" font-weight="400">stale or unavailable explicitly.</text>
<rect x="412" y="330" width="336" height="160" rx="13" fill="#DCEDE7" stroke="none"/>
<text x="428" y="355" fill="#286754" font-size="12" font-weight="700">Present in source</text>
<text x="428" y="383" fill="#162824" font-size="19" font-weight="700">Trail and Elevation</text>
<text x="428" y="409" fill="#435951" font-size="15" font-weight="400">Import GPX, render route/elevation, share</text>
<text x="428" y="426" fill="#435951" font-size="15" font-weight="400">to a peer and verify interrupted-transfer</text>
<text x="428" y="443" fill="#435951" font-size="15" font-weight="400">recovery.</text>
<rect x="40" y="330" width="336" height="160" rx="13" fill="#FFF0D0" stroke="none"/>
<text x="56" y="355" fill="#8A580A" font-size="12" font-weight="700">Runtime check needed</text>
<text x="56" y="383" fill="#162824" font-size="19" font-weight="700">Files and permissions</text>
<text x="56" y="409" fill="#435951" font-size="15" font-weight="400">Test location denied, empty map, invalid</text>
<text x="56" y="426" fill="#435951" font-size="15" font-weight="400">file, duplicate import and missing peer</text>
<text x="56" y="443" fill="#435951" font-size="15" font-weight="400">without blocking voice.</text>
<rect x="40" y="516" width="336" height="160" rx="13" fill="#DCEDE7" stroke="none"/>
<text x="56" y="541" fill="#286754" font-size="12" font-weight="700">Present in source</text>
<text x="56" y="569" fill="#162824" font-size="19" font-weight="700">Basecamp Repeater</text>
<text x="56" y="595" fill="#435951" font-size="15" font-weight="400">Start or stop a stationary relay. Show</text>
<text x="56" y="612" fill="#435951" font-size="15" font-weight="400">duty cycle, neighbors and diagnostics once</text>
<text x="56" y="629" fill="#435951" font-size="15" font-weight="400">running.</text>
<rect x="412" y="516" width="336" height="160" rx="13" fill="#F9E2DE" stroke="none"/>
<text x="428" y="541" fill="#A23930" font-size="12" font-weight="700">Gap</text>
<text x="428" y="569" fill="#162824" font-size="19" font-weight="700">Reachability gap</text>
<text x="428" y="595" fill="#435951" font-size="15" font-weight="400">Compose registers the route but the</text>
<text x="428" y="612" fill="#435951" font-size="15" font-weight="400">current cockpit does not call it. Check</text>
<text x="428" y="629" fill="#435951" font-size="15" font-weight="400">SwiftUI entry before claiming parity.</text>
<rect x="784" y="516" width="336" height="160" rx="13" fill="#FFF0D0" stroke="none"/>
<text x="800" y="541" fill="#8A580A" font-size="12" font-weight="700">Runtime check needed</text>
<text x="800" y="569" fill="#162824" font-size="19" font-weight="700">Field verification</text>
<text x="800" y="595" fill="#435951" font-size="15" font-weight="400">Validate link range, background behavior,</text>
<text x="800" y="612" fill="#435951" font-size="15" font-weight="400">power and reconnect on the intended</text>
<text x="800" y="629" fill="#435951" font-size="15" font-weight="400">repeater devices.</text>
