<text x="40" y="45" fill="#286754" font-size="15" font-weight="700">Intercom-Alpha / Engineering flows</text>
<text x="40" y="88" fill="#162824" font-size="32" font-weight="700">Safety and outdoor tools</text>
<text x="40" y="117" fill="#435951" font-size="16" font-weight="400">Keep each field task attached to the state it needs and the feedback it owes the user.</text>
<path d="M376 224 L412 224" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
