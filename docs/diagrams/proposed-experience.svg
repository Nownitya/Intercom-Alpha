<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 810" role="img" aria-labelledby="title description" font-family="system-ui, sans-serif"><title id="title">Proposed app experience</title><desc id="description">Keep the voice controls stable and move setup, optional tools and details into predictable destinations.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#577168"/></marker></defs>
<rect x="0" y="0" width="1160" height="810" rx="0" fill="#F3F6F3" stroke="none"/>
<text x="40" y="45" fill="#286754" font-size="15" font-weight="700">Intercom-Alpha / Product</text>
<text x="40" y="88" fill="#162824" font-size="32" font-weight="700">Proposed app experience</text>
<text x="40" y="117" fill="#435951" font-size="16" font-weight="400">Keep the voice controls stable and move setup, optional tools and details into predictable destinations.</text>
<path d="M376 224 L412 224" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M748 224 L784 224" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M784 410 L748 410" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M412 410 L376 410" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M376 596 L412 596" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M748 596 L784 596" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="144" width="336" height="160" rx="13" fill="#E4E9F9" stroke="none"/>
<text x="56" y="169" fill="#375AA1" font-size="12" font-weight="700">Proposed</text>
<text x="56" y="197" fill="#162824" font-size="19" font-weight="700">Intercom</text>
<text x="56" y="223" fill="#435951" font-size="15" font-weight="400">Use group/channel, connection, speaker,</text>
<text x="56" y="240" fill="#435951" font-size="15" font-weight="400">large momentary Talk and guarded SOS. Pair</text>
<text x="56" y="257" fill="#435951" font-size="15" font-weight="400">critical color with text.</text>
<rect x="412" y="144" width="336" height="160" rx="13" fill="#E4E9F9" stroke="none"/>
<text x="428" y="169" fill="#375AA1" font-size="12" font-weight="700">Proposed</text>
<text x="428" y="197" fill="#162824" font-size="19" font-weight="700">Group</text>
<text x="428" y="223" fill="#435951" font-size="15" font-weight="400">Create, join by QR or code, invite, view</text>
<text x="428" y="240" fill="#435951" font-size="15" font-weight="400">roster and leave. Reachable under every</text>
<text x="428" y="257" fill="#435951" font-size="15" font-weight="400">profile.</text>
<rect x="784" y="144" width="336" height="160" rx="13" fill="#E4E9F9" stroke="none"/>
<text x="800" y="169" fill="#375AA1" font-size="12" font-weight="700">Proposed</text>
<text x="800" y="197" fill="#162824" font-size="19" font-weight="700">Tools and settings</text>
<text x="800" y="223" fill="#435951" font-size="15" font-weight="400">Tools owns messages, Radar, Trail and</text>
<text x="800" y="240" fill="#435951" font-size="15" font-weight="400">Repeater. Settings owns Audio, Display,</text>
<text x="800" y="257" fill="#435951" font-size="15" font-weight="400">Battery and Advanced.</text>
<rect x="784" y="330" width="336" height="160" rx="13" fill="#E4E9F9" stroke="none"/>
<text x="800" y="355" fill="#375AA1" font-size="12" font-weight="700">Proposed</text>
<text x="800" y="383" fill="#162824" font-size="19" font-weight="700">Disconnected → listening</text>
<text x="800" y="409" fill="#435951" font-size="15" font-weight="400">Offer create/join. On success show the</text>
<text x="800" y="426" fill="#435951" font-size="15" font-weight="400">actual group and active channel.</text>
<text x="800" y="443" fill="#435951" font-size="15" font-weight="400">Distinguish waiting from connected.</text>
<rect x="412" y="330" width="336" height="160" rx="13" fill="#E4E9F9" stroke="none"/>
<text x="428" y="355" fill="#375AA1" font-size="12" font-weight="700">Proposed</text>
<text x="428" y="383" fill="#162824" font-size="19" font-weight="700">Press → transmit → release</text>
<text x="428" y="409" fill="#435951" font-size="15" font-weight="400">Provide immediate transmission feedback.</text>
<text x="428" y="426" fill="#435951" font-size="15" font-weight="400">Stop on interrupted gesture, backgrounding</text>
<text x="428" y="443" fill="#435951" font-size="15" font-weight="400">or connection loss.</text>
<rect x="40" y="330" width="336" height="160" rx="13" fill="#E4E9F9" stroke="none"/>
<text x="56" y="355" fill="#375AA1" font-size="12" font-weight="700">Proposed</text>
<text x="56" y="383" fill="#162824" font-size="19" font-weight="700">Reconnect → resume listening</text>
<text x="56" y="409" fill="#435951" font-size="15" font-weight="400">Keep the last group/channel visible,</text>
<text x="56" y="426" fill="#435951" font-size="15" font-weight="400">explain the outage and return to listening</text>
<text x="56" y="443" fill="#435951" font-size="15" font-weight="400">after recovery.</text>
<rect x="40" y="516" width="336" height="160" rx="13" fill="#E4E9F9" stroke="none"/>
<text x="56" y="541" fill="#375AA1" font-size="12" font-weight="700">Proposed</text>
<text x="56" y="569" fill="#162824" font-size="19" font-weight="700">Channel and profile</text>
<text x="56" y="595" fill="#435951" font-size="15" font-weight="400">Use a picker for active channel; mark</text>
<text x="56" y="612" fill="#435951" font-size="15" font-weight="400">monitored channels separately. Use</text>
<text x="56" y="629" fill="#435951" font-size="15" font-weight="400">single-choice lists for profiles.</text>
<rect x="412" y="516" width="336" height="160" rx="13" fill="#E4E9F9" stroke="none"/>
<text x="428" y="541" fill="#375AA1" font-size="12" font-weight="700">Proposed</text>
<text x="428" y="569" fill="#162824" font-size="19" font-weight="700">Optional display settings</text>
<text x="428" y="595" fill="#435951" font-size="15" font-weight="400">Use switches for meters, low-power UI and</text>
<text x="428" y="612" fill="#435951" font-size="15" font-weight="400">shortcuts. Disabled shortcuts leave tools</text>
<text x="428" y="629" fill="#435951" font-size="15" font-weight="400">and group actions reachable.</text>
<rect x="784" y="516" width="336" height="160" rx="13" fill="#E4E9F9" stroke="none"/>
<text x="800" y="541" fill="#375AA1" font-size="12" font-weight="700">Proposed</text>
<text x="800" y="569" fill="#162824" font-size="19" font-weight="700">Guarded SOS</text>
<text x="800" y="595" fill="#435951" font-size="15" font-weight="400">Confirm or cancel before sending, provide</text>
<text x="800" y="612" fill="#435951" font-size="15" font-weight="400">an accessible equivalent and report sent</text>
<text x="800" y="629" fill="#435951" font-size="15" font-weight="400">or failed state.</text>
<rect x="40" y="704" width="16" height="16" rx="3" fill="#DCEDE7" stroke="#286754"/>
<text x="65" y="717" fill="#286754" font-size="13" font-weight="700">Present in source</text>
<rect x="295" y="704" width="16" height="16" rx="3" fill="#FFF0D0" stroke="#8A580A"/>
<text x="320" y="717" fill="#8A580A" font-size="13" font-weight="700">Runtime check needed</text>
<rect x="550" y="704" width="16" height="16" rx="3" fill="#F9E2DE" stroke="#A23930"/>
<text x="575" y="717" fill="#A23930" font-size="13" font-weight="700">Gap</text>
<rect x="805" y="704" width="16" height="16" rx="3" fill="#E4E9F9" stroke="#375AA1"/>
<text x="830" y="717" fill="#375AA1" font-size="13" font-weight="700">Proposed</text>
<a href="https://github.com/Nownitya/Intercom-Alpha/blob/sprint/sprint-37-fleet-congestion-control/docs/adr/0021-context-adaptive-tactical-ui-profiles.md"><text x="40" y="750" fill="#286754" font-size="13" font-weight="700">0021-context-adaptive-tactical-ui-profiles.md</text></a>
<a href="https://github.com/Nownitya/Intercom-Alpha/blob/sprint/sprint-37-fleet-congestion-control/docs/DESIGN.md"><text x="580" y="750" fill="#286754" font-size="13" font-weight="700">DESIGN.md</text></a>
</svg>
