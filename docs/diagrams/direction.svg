<text x="56" y="383" fill="#162824" font-size="19" font-weight="700">Then expand dispatch</text>
<text x="56" y="409" fill="#435951" font-size="15" font-weight="400">Sprint 38 plans multi-squad basecamp</text>
<text x="56" y="426" fill="#435951" font-size="15" font-weight="400">tools. Exercise a basecamp node and three</text>
<text x="56" y="443" fill="#435951" font-size="15" font-weight="400">remote squads before RC sign-off.</text>
