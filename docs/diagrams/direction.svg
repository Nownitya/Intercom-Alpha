<text x="56" y="197" fill="#162824" font-size="19" font-weight="700">Fix setup and status</text>
<text x="56" y="223" fill="#435951" font-size="15" font-weight="400">Restore join/invite/leave paths. Replace</text>
<text x="56" y="240" fill="#435951" font-size="15" font-weight="400">guessed battery, peer and speaker values</text>
<text x="56" y="257" fill="#435951" font-size="15" font-weight="400">with known or unavailable states.</text>
