<text x="800" y="355" fill="#A23930" font-size="12" font-weight="700">Gap</text>
<text x="800" y="383" fill="#162824" font-size="19" font-weight="700">Resolve RF evidence</text>
<text x="800" y="409" fill="#435951" font-size="15" font-weight="400">Trace real measurements → policy →</text>
<text x="800" y="426" fill="#435951" font-size="15" font-weight="400">platform radio → observed PHY/congestion</text>
<text x="800" y="443" fill="#435951" font-size="15" font-weight="400">or explicit unsupported state.</text>
