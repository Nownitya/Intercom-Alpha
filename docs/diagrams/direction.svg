<text x="428" y="169" fill="#8A580A" font-size="12" font-weight="700">Runtime check needed</text>
<text x="428" y="197" fill="#162824" font-size="19" font-weight="700">Prove the core journey</text>
<text x="428" y="223" fill="#435951" font-size="15" font-weight="400">Android and iOS pass create/join → channel</text>
<text x="428" y="240" fill="#435951" font-size="15" font-weight="400">→ talk → listen → disconnect → recover →</text>
<text x="428" y="257" fill="#435951" font-size="15" font-weight="400">leave using two phones.</text>
<rect x="784" y="144" width="336" height="160" rx="13" fill="#E4E9F9" stroke="none"/>
<text x="800" y="169" fill="#375AA1" font-size="12" font-weight="700">Proposed</text>
<text x="800" y="197" fill="#162824" font-size="19" font-weight="700">Simplify the cockpit</text>
<text x="800" y="223" fill="#435951" font-size="15" font-weight="400">Compact portrait and large text preserve</text>
<text x="800" y="240" fill="#435951" font-size="15" font-weight="400">Talk, channel and SOS. Tool and settings</text>
<text x="800" y="257" fill="#435951" font-size="15" font-weight="400">navigation stays predictable.</text>
