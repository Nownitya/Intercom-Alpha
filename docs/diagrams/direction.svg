<text x="428" y="383" fill="#162824" font-size="19" font-weight="700">Close Sprint 37</text>
<text x="428" y="409" fill="#435951" font-size="15" font-weight="400">Resolve 24-node Ralph vs 32-node roadmap</text>
<text x="428" y="426" fill="#435951" font-size="15" font-weight="400">mismatch before acceptance. Keep</text>
<text x="428" y="443" fill="#435951" font-size="15" font-weight="400">simulation and field range evidence</text>
<text x="428" y="460" fill="#435951" font-size="15" font-weight="400">separate.</text>
