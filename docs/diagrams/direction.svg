<text x="56" y="569" fill="#162824" font-size="19" font-weight="700">Soak and release</text>
<text x="56" y="595" fill="#435951" font-size="15" font-weight="400">Sprint 39 plans mixed-device field soak,</text>
<text x="56" y="612" fill="#435951" font-size="15" font-weight="400">battery profiling, signing and release</text>
<text x="56" y="629" fill="#435951" font-size="15" font-weight="400">artifacts.</text>
