<a href="https://github.com/Nownitya/Intercom-Alpha/blob/sprint/sprint-37-fleet-congestion-control/docs/ARCHITECTURE.md"><text x="580" y="750" fill="#286754" font-size="13" font-weight="700">ARCHITECTURE.md</text></a>
