<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 810" role="img" aria-labelledby="title description" font-family="system-ui, sans-serif"><title id="title">Current Android and iOS journeys</title><desc id="description">Each lane follows a rider from setup to operating and recovering the session.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#577168"/></marker></defs>
<rect x="0" y="0" width="1160" height="810" rx="0" fill="#F3F6F3" stroke="none"/>
<text x="40" y="45" fill="#286754" font-size="15" font-weight="700">Intercom-Alpha / Product</text>
<text x="40" y="88" fill="#162824" font-size="32" font-weight="700">Current Android and iOS journeys</text>
<text x="40" y="117" fill="#435951" font-size="16" font-weight="400">Each lane follows a rider from setup to operating and recovering the session.</text>
<path d="M376 224 L412 224" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M748 224 L784 224" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M784 410 L748 410" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M412 410 L376 410" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M376 596 L412 596" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M748 596 L784 596" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="144" width="336" height="160" rx="13" fill="#F9E2DE" stroke="none"/>
<text x="56" y="169" fill="#A23930" font-size="12" font-weight="700">Gap</text>
<text x="56" y="197" fill="#162824" font-size="19" font-weight="700">Android · setup</text>
<text x="56" y="223" fill="#435951" font-size="15" font-weight="400">Request microphone and BLE access. Convoy</text>
<text x="56" y="240" fill="#435951" font-size="15" font-weight="400">Join / Share changes state but the cockpit</text>
<text x="56" y="257" fill="#435951" font-size="15" font-weight="400">presents neither dialog.</text>
<rect x="412" y="144" width="336" height="160" rx="13" fill="#DCEDE7" stroke="none"/>
<text x="428" y="169" fill="#286754" font-size="12" font-weight="700">Present in source</text>
<text x="428" y="197" fill="#162824" font-size="19" font-weight="700">Android · operate</text>
<text x="428" y="223" fill="#435951" font-size="15" font-weight="400">Voice tab exposes channel strip, PTT, SOS,</text>
<text x="428" y="240" fill="#435951" font-size="15" font-weight="400">hazard pills and meters.</text>
<rect x="784" y="144" width="336" height="160" rx="13" fill="#F9E2DE" stroke="none"/>
<text x="800" y="169" fill="#A23930" font-size="12" font-weight="700">Gap</text>
<text x="800" y="197" fill="#162824" font-size="19" font-weight="700">Android · recover</text>
<text x="800" y="223" fill="#435951" font-size="15" font-weight="400">Cockpit diagnostics has an empty handler.</text>
<text x="800" y="240" fill="#435951" font-size="15" font-weight="400">A complete reconnect and leave path needs</text>
<text x="800" y="257" fill="#435951" font-size="15" font-weight="400">device validation.</text>
<rect x="784" y="330" width="336" height="160" rx="13" fill="#F9E2DE" stroke="none"/>
<text x="800" y="355" fill="#A23930" font-size="12" font-weight="700">Gap</text>
<text x="800" y="383" fill="#162824" font-size="19" font-weight="700">iOS · setup</text>
<text x="800" y="409" fill="#435951" font-size="15" font-weight="400">Convoy presents QR scanner and share</text>
<text x="800" y="426" fill="#435951" font-size="15" font-weight="400">sheet. Minimal or hidden Convoy removes</text>
<text x="800" y="443" fill="#435951" font-size="15" font-weight="400">these entry points.</text>
<rect x="412" y="330" width="336" height="160" rx="13" fill="#DCEDE7" stroke="none"/>
<text x="428" y="355" fill="#286754" font-size="12" font-weight="700">Present in source</text>
<text x="428" y="383" fill="#162824" font-size="19" font-weight="700">iOS · operate</text>
<text x="428" y="409" fill="#435951" font-size="15" font-weight="400">Native cockpit handles channel and PTT.</text>
<text x="428" y="426" fill="#435951" font-size="15" font-weight="400">Crash countdown can overlay tabs.</text>
<rect x="40" y="330" width="336" height="160" rx="13" fill="#F9E2DE" stroke="none"/>
<text x="56" y="355" fill="#A23930" font-size="12" font-weight="700">Gap</text>
<text x="56" y="383" fill="#162824" font-size="19" font-weight="700">iOS · recover</text>
<text x="56" y="409" fill="#435951" font-size="15" font-weight="400">Diagnostics callback is empty. Verify</text>
<text x="56" y="426" fill="#435951" font-size="15" font-weight="400">leave, denied permissions and reconnect</text>
<text x="56" y="443" fill="#435951" font-size="15" font-weight="400">from the actual UI.</text>
<rect x="40" y="516" width="336" height="160" rx="13" fill="#FFF0D0" stroke="none"/>
<text x="56" y="541" fill="#8A580A" font-size="12" font-weight="700">Runtime check needed</text>
<text x="56" y="569" fill="#162824" font-size="19" font-weight="700">Shared · permissions</text>
<text x="56" y="595" fill="#435951" font-size="15" font-weight="400">Exercise cold start with granted, denied</text>
<text x="56" y="612" fill="#435951" font-size="15" font-weight="400">and revoked microphone/BLE access; camera</text>
<text x="56" y="629" fill="#435951" font-size="15" font-weight="400">is needed for QR.</text>
<rect x="412" y="516" width="336" height="160" rx="13" fill="#FFF0D0" stroke="none"/>
<text x="428" y="541" fill="#8A580A" font-size="12" font-weight="700">Runtime check needed</text>
<text x="428" y="569" fill="#162824" font-size="19" font-weight="700">Shared · listen</text>
<text x="428" y="595" fill="#435951" font-size="15" font-weight="400">Verify the channel, actual remote speaker</text>
<text x="428" y="612" fill="#435951" font-size="15" font-weight="400">and audio output on two different phones.</text>
<rect x="784" y="516" width="336" height="160" rx="13" fill="#FFF0D0" stroke="none"/>
<text x="800" y="541" fill="#8A580A" font-size="12" font-weight="700">Runtime check needed</text>
<text x="800" y="569" fill="#162824" font-size="19" font-weight="700">Shared · resume</text>
<text x="800" y="595" fill="#435951" font-size="15" font-weight="400">Walk out of range, return, confirm</text>
<text x="800" y="612" fill="#435951" font-size="15" font-weight="400">recovery and verify no previous</text>
<text x="800" y="629" fill="#435951" font-size="15" font-weight="400">transmission resumes.</text>
<rect x="40" y="704" width="16" height="16" rx="3" fill="#DCEDE7" stroke="#286754"/>
<text x="65" y="717" fill="#286754" font-size="13" font-weight="700">Present in source</text>
<rect x="295" y="704" width="16" height="16" rx="3" fill="#FFF0D0" stroke="#8A580A"/>
<text x="320" y="717" fill="#8A580A" font-size="13" font-weight="700">Runtime check needed</text>
<rect x="550" y="704" width="16" height="16" rx="3" fill="#F9E2DE" stroke="#A23930"/>
<text x="575" y="717" fill="#A23930" font-size="13" font-weight="700">Gap</text>
<rect x="805" y="704" width="16" height="16" rx="3" fill="#E4E9F9" stroke="#375AA1"/>
<text x="830" y="717" fill="#375AA1" font-size="13" font-weight="700">Proposed</text>
