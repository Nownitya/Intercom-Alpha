<rect x="40" y="144" width="336" height="160" rx="13" fill="#DCEDE7" stroke="none"/>
<text x="56" y="169" fill="#286754" font-size="12" font-weight="700">Present in source</text>
<text x="56" y="197" fill="#162824" font-size="19" font-weight="700">BLE-first send</text>
<text x="56" y="223" fill="#435951" font-size="15" font-weight="400">Use the local transport while the route is</text>
<text x="56" y="240" fill="#435951" font-size="15" font-weight="400">suitable. Receiving peers check packet</text>
<text x="56" y="257" fill="#435951" font-size="15" font-weight="400">novelty before forwarding.</text>
<rect x="412" y="144" width="336" height="160" rx="13" fill="#DCEDE7" stroke="none"/>
<text x="428" y="169" fill="#286754" font-size="12" font-weight="700">Present in source</text>
<text x="428" y="197" fill="#162824" font-size="19" font-weight="700">Path deteriorates</text>
<text x="428" y="223" fill="#435951" font-size="15" font-weight="400">Shared link/failover policy can select a</text>
<text x="428" y="240" fill="#435951" font-size="15" font-weight="400">cloud path where configured and reachable.</text>
<rect x="784" y="144" width="336" height="160" rx="13" fill="#FFF0D0" stroke="none"/>
<text x="800" y="169" fill="#8A580A" font-size="12" font-weight="700">Runtime check needed</text>
<text x="800" y="197" fill="#162824" font-size="19" font-weight="700">Return to BLE</text>
<text x="800" y="223" fill="#435951" font-size="15" font-weight="400">Exercise failed fallback, duplicate</text>
<text x="800" y="240" fill="#435951" font-size="15" font-weight="400">delivery and recovery. Confirm no previous</text>
<text x="800" y="257" fill="#435951" font-size="15" font-weight="400">PTT session resumes.</text>
<rect x="784" y="330" width="336" height="160" rx="13" fill="#FFF0D0" stroke="none"/>
<text x="800" y="355" fill="#8A580A" font-size="12" font-weight="700">Runtime check needed</text>
<text x="800" y="383" fill="#162824" font-size="19" font-weight="700">Observe airtime and link</text>
<text x="800" y="409" fill="#435951" font-size="15" font-weight="400">Locate real occupancy, RSSI and</text>
<text x="800" y="426" fill="#435951" font-size="15" font-weight="400">packet-loss inputs and distinguish missing</text>
<text x="800" y="443" fill="#435951" font-size="15" font-weight="400">samples.</text>
<rect x="412" y="330" width="336" height="160" rx="13" fill="#DCEDE7" stroke="none"/>
<text x="428" y="355" fill="#286754" font-size="12" font-weight="700">Present in source</text>
<text x="428" y="383" fill="#162824" font-size="19" font-weight="700">Evaluate policy</text>
<text x="428" y="409" fill="#435951" font-size="15" font-weight="400">Shared congestion governor and PHY</text>
<text x="428" y="426" fill="#435951" font-size="15" font-weight="400">switcher can produce throttling and PHY</text>
<text x="428" y="443" fill="#435951" font-size="15" font-weight="400">decisions.</text>
<rect x="40" y="330" width="336" height="160" rx="13" fill="#F9E2DE" stroke="none"/>
<text x="56" y="355" fill="#A23930" font-size="12" font-weight="700">Gap</text>
<text x="56" y="383" fill="#162824" font-size="19" font-weight="700">Apply on radio</text>
<text x="56" y="409" fill="#435951" font-size="15" font-weight="400">Android production attachment and actual</text>
<text x="56" y="426" fill="#435951" font-size="15" font-weight="400">PHY application were not established by</text>
<text x="56" y="443" fill="#435951" font-size="15" font-weight="400">the source audit. Confirm platform</text>
<text x="56" y="460" fill="#435951" font-size="15" font-weight="400">support.</text>
<rect x="40" y="516" width="336" height="160" rx="13" fill="#FFF0D0" stroke="none"/>
<text x="56" y="541" fill="#8A580A" font-size="12" font-weight="700">Runtime check needed</text>
<text x="56" y="569" fill="#162824" font-size="19" font-weight="700">Observe applied result</text>
<text x="56" y="595" fill="#435951" font-size="15" font-weight="400">Separate requested mode, applied mode and</text>
<text x="56" y="612" fill="#435951" font-size="15" font-weight="400">unsupported state. Validate against device</text>
<text x="56" y="629" fill="#435951" font-size="15" font-weight="400">observations.</text>
<rect x="412" y="516" width="336" height="160" rx="13" fill="#F9E2DE" stroke="none"/>
<text x="428" y="541" fill="#A23930" font-size="12" font-weight="700">Gap</text>
<text x="428" y="569" fill="#162824" font-size="19" font-weight="700">Expose in UI</text>
<text x="428" y="595" fill="#435951" font-size="15" font-weight="400">Bridge snapshots and Compose indicators</text>
<text x="428" y="612" fill="#435951" font-size="15" font-weight="400">exist. Empty diagnostics handlers and iOS</text>
<text x="428" y="629" fill="#435951" font-size="15" font-weight="400">observer reachability remain gaps.</text>
<rect x="784" y="516" width="336" height="160" rx="13" fill="#FFF0D0" stroke="none"/>
<text x="800" y="541" fill="#8A580A" font-size="12" font-weight="700">Runtime check needed</text>
<text x="800" y="569" fill="#162824" font-size="19" font-weight="700">Prove end to end</text>
<text x="800" y="595" fill="#435951" font-size="15" font-weight="400">Capture radio evidence on both phone</text>
<text x="800" y="612" fill="#435951" font-size="15" font-weight="400">platforms and run the outstanding density</text>
<text x="800" y="629" fill="#435951" font-size="15" font-weight="400">simulation under agreed node count.</text>
