<text x="40" y="45" fill="#286754" font-size="15" font-weight="700">Intercom-Alpha / Engineering flows</text>
<text x="40" y="88" fill="#162824" font-size="32" font-weight="700">Relay, congestion, and recovery</text>
<text x="40" y="117" fill="#435951" font-size="16" font-weight="400">Track packet routing and the separate loop that should turn RF measurements into radio behavior.</text>
<path d="M376 224 L412 224" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M748 224 L784 224" stroke="#577168" stroke-width="2" marker-end="url(#arrow)"/>
