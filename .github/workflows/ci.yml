name: Multiplatform CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'sprint/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
      - 'sprint/**'
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  android:
    name: Android build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
        shell: bash {0}
      - name: Run tests and build Android APKs
        run: |
          chmod +x gradlew
          ./gradlew test :app:androidApp:assembleDebug :app:androidApp:assembleRelease --no-daemon --stacktrace
      - name: Upload Android verification APKs
        uses: actions/upload-artifact@v4
        with:
          name: intercom-alpha-android-verification-apks
          path: app/androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS SwiftUI build and simulator tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      - name: Run shared Kotlin tests on iOS simulator
        run: |
          chmod +x gradlew
          ./gradlew :app:sharedLogic:compileKotlinIosSimulatorArm64 :app:sharedLogic:iosSimulatorArm64Test --no-daemon --stacktrace
      - name: Build native SwiftUI app for simulator
        run: |
          xcodebuild -project app/iosApp/iosApp.xcodeproj -target iosApp \
            -configuration Debug -sdk iphonesimulator ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

  release:
    name: Draft GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected a version tag such as v3.0.0 or v3.0.0-rc.1.'
            exit 1
          fi
          tagged_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          expected_commit="$(git rev-parse "${EXPECTED_SHA}^{commit}")"
          test "$tagged_commit" = "$expected_commit"
          git merge-base --is-ancestor "$tagged_commit" origin/main

          existing_tag="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | .tag_name' | awk -v tag="$RELEASE_TAG" '$0 == tag')"
          if [[ -n "$existing_tag" ]]; then
            echo "Release already exists for $RELEASE_TAG."
            exit 0
          fi

          options=(--draft --verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${options[@]}"
