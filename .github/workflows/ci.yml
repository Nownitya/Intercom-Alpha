name: Multiplatform CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'sprint/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
      - 'sprint/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  multiplatform-test:
    name: Multiplatform Tests & iOS Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Multiplatform Unit Tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Compile iOS KMP Multiplatform Framework
        run: ./gradlew :app:sharedLogic:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace

  android-release-build:
    name: Android Release Build & R8 Verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [multiplatform-test]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Assemble Android Release APK (Verify ProGuard / R8)
        run: ./gradlew :app:androidApp:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: intercom-alpha-release-apk
          path: app/androidApp/build/outputs/apk/release/*.apk
          retention-days: 14
