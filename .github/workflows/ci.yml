name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build & Test Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Multiplatform Unit Tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Assemble Android Debug APK
        run: ./gradlew :app:androidApp:assembleDebug --no-daemon --stacktrace

      - name: Compile iOS KMP Multiplatform Framework
        run: ./gradlew :app:sharedLogic:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace
